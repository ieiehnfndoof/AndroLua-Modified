name: Build AndroLua APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms, build-tools and NDK
        run: |
          yes | sdkmanager "platforms;android-28" "build-tools;28.0.3" "ndk;21.4.7075529" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Install Gradle 4.10.3 directly (no wrapper needed)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-4.10.3/bin" >> $GITHUB_PATH

      - name: Fix deprecated jcenter repository
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle
          sed -i 's/jcenter()/mavenCentral()/g' app/build.gradle 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AndroLua-Modified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
